name: release

# Tagging is the whole trigger. Building the binary by hand is the step that
# gets skipped on a tired evening, and then a release ships a binary that does
# not match the source it claims to be.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach a binary to"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Work out the version
        id: version
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A release that fails its own tests is worse than no release: it is a
      # tool for finding holes, shipped without knowing whether it works.
      - name: Test
        run: swift test

      # Stamped rather than kept in step with the tag by hand: the two drift,
      # and the formula's own test compares `litmus --version` against the
      # version it installed.
      - name: Stamp the version
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.tag }}"
          sed -i '' "s/static let version = \".*\"/static let version = \"${V#v}\"/" \
            Sources/litmus/Litmus.swift

          # Checked, because a rename would leave the sed matching nothing and
          # ship a binary that calls itself "dev" without a word.
          grep -q "static let version = \"${V#v}\"" Sources/litmus/Litmus.swift \
            || { echo "::error::the version stamp did not apply"; exit 1; }

      - name: Build
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Check the binary stands on its own
        run: |
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/litmus
          file "$BIN"

          # Per architecture: `otool -L` on a universal binary prints a
          # "(architecture x86_64):" header for each slice, and those lines are
          # not paths, so a plain grep reads them as foreign libraries.
          for arch in arm64 x86_64; do
            # Selected by shape, not by line number. otool prints a header for
            # the file and another for the slice, and the count differs between
            # toolchains; a `tail -n +2` guessed at it and read a leftover
            # header as a library. Dependency lines are the indented ones.
            FOREIGN=$(otool -arch "$arch" -L "$BIN" \
                        | grep '^[[:space:]]' \
                        | grep -vE '^[[:space:]]+(/usr/lib/|/System/)' || true)

            # Anything outside /usr/lib and /System is a library the installing
            # machine has no reason to have.
            if [ -n "$FOREIGN" ]; then
              echo "::error::the $arch slice links something outside the system"
              echo "$FOREIGN"
              exit 1
            fi
          done

          "$BIN" --help > /dev/null

          # The formula asserts this against the version it installed.
          [ "$("$BIN" --version)" = "${TAG#v}" ] \
            || { echo "::error::binary reports $("$BIN" --version), not ${TAG#v}"; exit 1; }
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Package
        id: package
        run: |
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/litmus
          NAME="litmus-${{ steps.version.outputs.tag }}-macos-universal.tar.gz"
          mkdir -p dist && cp "$BIN" dist/ && cp LICENSE NOTICE dist/
          tar -czf "$NAME" -C dist .
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        run: |
          gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ steps.version.outputs.tag }}" \
                 --title "${{ steps.version.outputs.tag }}" --generate-notes
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.name }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
