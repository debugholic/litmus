name: litmus

# Litmus on its own source, for the score badge in the README. A tool for
# finding holes in tests should say how many its own tests have.
#
# Weekly rather than on every push: the whole tree is hours, and a run each
# merge only cancelled the one before it.
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      only:
        description: "Only mutate files whose path contains this, to try a change quickly. Empty scores the whole tree."
        required: false
        default: ""

# One at a time per ref. A run started by hand waits for the one going
# rather than throwing away its hours.
concurrency:
  group: litmus-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  score:
    runs-on: macos-15
    # The most a GitHub-hosted runner gives a job.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build -c release

      # --all rather than relying on main having nothing to compare against:
      # the badge is for the whole tree, and should not narrow if that changes.
      - name: Run Litmus on itself
        run: |
          set -o pipefail
          BIN=$(swift build -c release --show-bin-path)/litmus
          ONLY=()
          if [ -n "${{ inputs.only }}" ]; then ONLY=(--only "${{ inputs.only }}"); fi
          "$BIN" --all "${ONLY[@]}" --format json --output litmus.json 2>&1 | tee litmus.log

      # Litmus says the suite could not run, not why. The baseline is one
      # `swift test --skip-build` in its working copy, so run that again where
      # it ran and keep what it printed.
      - name: Run the baseline again, for its log
        if: failure() || cancelled()
        run: |
          mkdir -p diagnostics
          cp litmus.log diagnostics/ || true
          COPY=$(ls -dt "$HOME"/Library/Caches/litmus/*/ | head -1)
          echo "working copy: $COPY" | tee diagnostics/baseline.log
          swift --version >> diagnostics/baseline.log 2>&1
          SYSTEM=$(swift build --help 2>&1 | grep -q -- '--build-system' && swift build --help 2>&1 | grep -q native && echo "--build-system native" || true)
          (cd "$COPY" && swift test --skip-build $SYSTEM) >> diagnostics/baseline.log 2>&1 || true
          tail -60 diagnostics/baseline.log

      - name: Keep the logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: litmus-diagnostics
          path: diagnostics/
          retention-days: 7

      # The shields.io endpoint format. Colours follow the report's own
      # thresholds: 80 and up is good, under 60 bad.
      - name: Write the badge
        run: |
          mkdir -p badge
          # Coloured by the number it shows: 79.6 read "80%" in yellow.
          jq '(.score | if . == null then null else round end) as $s | {
                schemaVersion: 1,
                label: "litmus score",
                message: (if $s == null then "—" else "\($s)%" end),
                color: (if $s == null then "lightgrey"
                        elif $s >= 80 then "brightgreen"
                        elif $s >= 60 then "yellow"
                        else "red" end)
              }' litmus.json > badge/litmus.json
          cp litmus.json badge/report.json
          cat badge/litmus.json

      # An orphan branch holding only the badge: the default token can push
      # it, and main's history is not filled with score bumps.
      # Only main's score is the badge; a run started by hand on a branch is
      # for its logs.
      - name: Publish to the badges branch
        if: github.ref == 'refs/heads/main' && inputs.only == ''
        run: |
          cd badge
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "litmus score for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GH_TOKEN: ${{ github.token }}
